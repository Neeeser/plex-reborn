name: Bug report
description: Something in Plex Reborn is broken or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone and orientation
      placeholder: iPhone Duo, unfolded, landscape
    validations:
      required: true
